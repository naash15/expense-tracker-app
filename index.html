<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slick Finance Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
        .hidden { display: none; }
        input, select { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 0.375rem; padding: 0.5rem; width: 100%; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        button.btn-primary { background: #0284c7; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; transition: 0.2s; }
        button.btn-primary:hover { background: #0369a1; }
        .progress-bar { transition: width 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Login Screen -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen px-4">
        <h1 class="text-3xl font-bold mb-8 tracking-tight text-sky-400">Tracker Login</h1>
        <div class="bg-slate-800 p-6 rounded-xl w-full max-w-sm shadow-lg">
            <input type="email" id="email" placeholder="Email" class="mb-4">
            <input type="password" id="password" placeholder="Password" class="mb-6">
            <!-- HARDWIRED ONCLICK EVENT ADDED HERE -->
            <button id="login-btn" class="btn-primary w-full" onclick="handleLogin()">Sign In</button>
            <p id="auth-error" class="text-red-400 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- Main App Dashboard -->
    <div id="app-dashboard" class="hidden flex-col min-h-screen">
        
        <!-- Header & Top Controls -->
        <header class="bg-slate-800 p-4 shadow-md sticky top-0 z-20 space-y-3">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold text-sky-400">Finances</h1>
                <div class="flex gap-3">
                    <button id="export-csv" class="text-emerald-400 hover:text-emerald-300" title="Export to CSV"><i class="fa-solid fa-file-csv fa-lg"></i></button>
                    <button id="logout-btn" class="text-slate-400 hover:text-white" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket fa-lg"></i></button>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <select id="month-selector" class="flex-1 text-sm bg-slate-700"></select>
                <button id="add-month-btn" class="bg-slate-700 p-2 rounded text-sky-400 hover:bg-slate-600"><i class="fa-solid fa-plus"></i></button>
                <button id="set-default-month" class="bg-slate-700 p-2 rounded text-slate-300 hover:bg-slate-600" title="Set as Default Month"><i class="fa-solid fa-thumbtack"></i></button>
            </div>
        </header>

        <!-- Live Fuel Tracker Section -->
        <div class="px-4 pt-4">
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-sm font-bold text-slate-300"><i class="fa-solid fa-gas-pump mr-2 text-sky-400"></i>Monthly Fuel</h3>
                    <span id="fuel-status" class="text-xs font-bold"></span>
                </div>
                <div class="flex gap-4 mb-3">
                    <div>
                        <label class="text-xs text-slate-500">Allocated</label>
                        <input type="number" id="fuel-budget" class="text-sm p-1" value="0" onchange="updateFuel()">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">Used</label>
                        <input type="number" id="fuel-used" class="text-sm p-1" value="0" onchange="updateFuel()">
                    </div>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-2.5">
                    <div id="fuel-bar" class="progress-bar h-2.5 rounded-full bg-emerald-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Analytics Toggle -->
        <div class="px-4 pt-4 text-center">
            <button id="toggle-charts" class="text-sm text-sky-400 hover:text-sky-300"><i class="fa-solid fa-chart-pie mr-1"></i> Toggle Analytics Graph</button>
            <div id="charts-container" class="hidden mt-4 bg-slate-800 p-4 rounded-xl shadow-lg">
                <canvas id="expenseChart" height="200"></canvas>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex justify-around bg-slate-900 border-b border-slate-700 mt-4 px-2 sticky top-[120px] z-10">
            <button id="tab-projected" class="pb-2 px-4 tab-active font-semibold text-sm">Projected</button>
            <button id="tab-actual" class="pb-2 px-4 text-slate-400 font-semibold text-sm">Actual Tracker</button>
            <button id="tab-savings" class="pb-2 px-4 text-slate-400 font-semibold text-sm">Global Savings</button>
        </div>

        <!-- Content Area -->
        <main class="flex-1 p-4 pb-20 overflow-y-auto">
            
            <!-- Projected View -->
            <div id="view-projected" class="space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center shadow-md">
                    <span class="text-slate-400 text-sm">Projected Remaining</span>
                    <span id="proj-remaining" class="text-xl font-bold text-emerald-400">R 0</span>
                </div>
                <div id="projected-list" class="space-y-2"></div>
                <button class="btn-primary w-full mt-4 bg-slate-700 hover:bg-slate-600 border border-slate-600" onclick="addEntry('projected')">+ Add Expected Item</button>
            </div>

            <!-- Actual View -->
            <div id="view-actual" class="hidden space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl grid grid-cols-2 gap-4 shadow-md">
                    <div>
                        <span class="text-slate-400 text-xs block">Total Income</span>
                        <span id="actual-income" class="text-lg font-bold text-emerald-400">R 0</span>
                    </div>
                    <div class="text-right">
                        <span class="text-slate-400 text-xs block">Total Spent</span>
                        <span id="actual-total" class="text-lg font-bold text-rose-400">R 0</span>
                    </div>
                </div>
                <div id="actual-list" class="space-y-2"></div>
                <div class="flex gap-2 mt-4">
                    <button class="btn-primary flex-1 bg-emerald-600 hover:bg-emerald-700" onclick="addEntry('actual', true)">+ Log Income</button>
                    <button class="btn-primary flex-1 bg-rose-600 hover:bg-rose-700" onclick="addEntry('actual', false)">+ Log Expense</button>
                </div>
            </div>

            <!-- Savings View -->
            <div id="view-savings" class="hidden space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center shadow-md">
                    <span class="text-slate-400 text-sm">Total Saved</span>
                    <span id="savings-total" class="text-xl font-bold text-sky-400">R 0</span>
                </div>
                <div id="savings-list" class="space-y-2"></div>
                <button class="btn-primary w-full mt-4 bg-sky-600 hover:bg-sky-700" onclick="addEntry('savings')">+ Add Savings Pot</button>
            </div>

        </main>
    </div>

    <!-- Firebase and Logic Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDEJZzFtITgSstK9Kd5jV9KnUriw3EZv6M",
          authDomain: "my-expense-tracker-30b57.firebaseapp.com",
          projectId: "my-expense-tracker-30b57",
          storageBucket: "my-expense-tracker-30b57.firebasestorage.app",
          messagingSenderId: "931806220777",
          appId: "1:931806220777:web:7aad0217e0d0ae7e7bbb78"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Data State Management
        let currentMonth = localStorage.getItem('defaultMonth') || '2026-09';
        let chartInstance = null;
        
        let dbState = {
            '2026-09': {
                fuel: { budget: 2000, used: 450 },
                projected: [
                    { id: 1, name: 'Takealot Salary', amount: 23045, isIncome: true },
                    { id: 2, name: 'Standard Bank Bond', amount: 9880, isIncome: false },
                    { id: 3, name: 'UNISA', amount: 2500, isIncome: false }
                ],
                actual: [
                    { id: 1, name: 'Salary Paid', amount: 23045, isIncome: true },
                    { id: 2, name: 'Woolies', amount: 120, isIncome: false },
                    { id: 3, name: 'Playtomic App', amount: 150, isIncome: false }
                ],
                savings: [
                    { id: 1, name: 'Tokyo Trip Fund', amount: 15000 },
                    { id: 2, name: 'Joint Savings (Aneeqah & I)', amount: 5000 }
                ]
            }
        };

        // DOM Elements
        const screens = { login: document.getElementById('login-screen'), app: document.getElementById('app-dashboard') };
        const views = { projected: document.getElementById('view-projected'), actual: document.getElementById('view-actual'), savings: document.getElementById('view-savings') };
        const tabs = { projected: document.getElementById('tab-projected'), actual: document.getElementById('tab-actual'), savings: document.getElementById('tab-savings') };
        const monthSelect = document.getElementById('month-selector');

        // DIRECT AUTH FUNCTIONS
        window.handleLogin = function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errTxt = document.getElementById('auth-error');
            const btn = document.getElementById('login-btn');
            
            errTxt.classList.add('hidden');
            btn.textContent = "Authenticating...";

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => { showApp(); })
                .catch(err => {
                    errTxt.textContent = "Error: " + err.message;
                    errTxt.classList.remove('hidden');
                    btn.textContent = "Sign In";
                });
        };

        window.handleLogout = function() {
            signOut(auth);
        };

        onAuthStateChanged(auth, user => { user ? showApp() : (screens.login.classList.remove('hidden'), screens.app.classList.add('hidden')) });

        function showApp() {
            screens.login.classList.add('hidden');
            screens.app.classList.remove('hidden');
            updateMonthDropdown();
            renderUI();
        }

        // Tabs
        Object.keys(tabs).forEach(key => {
            tabs[key].addEventListener('click', () => {
                Object.values(views).forEach(v => v.classList.add('hidden'));
                Object.values(tabs).forEach(t => { t.classList.remove('tab-active'); t.classList.add('text-slate-400'); });
                views[key].classList.remove('hidden');
                tabs[key].classList.add('tab-active');
                tabs[key].classList.remove('text-slate-400');
            });
        });

        // Month Management
        function updateMonthDropdown() {
            monthSelect.innerHTML = '';
            Object.keys(dbState).sort().forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                if(m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            });
        }

        monthSelect.addEventListener('change', (e) => { currentMonth = e.target.value; renderUI(); });
        
        document.getElementById('add-month-btn').addEventListener('click', () => {
            const newM = prompt("Enter new month (e.g. 2026-10):");
            if (newM && !dbState[newM]) {
                dbState[newM] = { fuel: { budget: 0, used: 0 }, projected: [], actual: [], savings: [] };
                currentMonth = newM;
                updateMonthDropdown();
                renderUI();
            }
        });

        document.getElementById('set-default-month').addEventListener('click', () => {
            localStorage.setItem('defaultMonth', currentMonth);
            alert(`${currentMonth} is now set as your default login month!`);
        });

        // Data Management Methods
        window.updateFuel = function() {
            const budget = parseFloat(document.getElementById('fuel-budget').value) || 0;
            const used = parseFloat(document.getElementById('fuel-used').value) || 0;
            dbState[currentMonth].fuel = { budget, used };
            
            const bar = document.getElementById('fuel-bar');
            const status = document.getElementById('fuel-status');
            
            if (budget === 0) { bar.style.width = '0%'; status.textContent = ''; return; }
            
            const perc = Math.min((used / budget) * 100, 100);
            bar.style.width = `${perc}%`;
            
            status.textContent = `R ${budget - used} Left`;
            bar.className = 'progress-bar h-2.5 rounded-full ' + (perc < 60 ? 'bg-emerald-500' : perc < 85 ? 'bg-amber-500' : 'bg-rose-600');
            status.className = 'text-xs font-bold ' + (perc < 60 ? 'text-emerald-500' : perc < 85 ? 'text-amber-500' : 'text-rose-600');
        }

        window.addEntry = function(type, isIncome = false) {
            dbState[currentMonth][type].push({ id: Date.now(), name: '', amount: 0, isIncome: isIncome });
            renderUI();
        }

        window.deleteEntry = function(type, id) {
            dbState[currentMonth][type] = dbState[currentMonth][type].filter(item => item.id !== id);
            renderUI();
        }
        
        window.updateVal = function(type, id, field, val) {
            const item = dbState[currentMonth][type].find(i => i.id === id);
            if (item) { item[field] = field === 'amount' ? parseFloat(val) || 0 : val; renderUI(); }
        }

        // CSV Export
        document.getElementById('export-csv').addEventListener('click', () => {
            let csv = "Month,Tab,Type,Name,Amount\n";
            Object.keys(dbState).forEach(m => {
                dbState[m].projected.forEach(i => csv += `${m},Projected,${i.isIncome ? 'Income' : 'Expense'},"${i.name}",${i.amount}\n`);
                dbState[m].actual.forEach(i => csv += `${m},Actual,${i.isIncome ? 'Income' : 'Expense'},"${i.name}",${i.amount}\n`);
                dbState[m].savings.forEach(i => csv += `${m},Savings,Fund,"${i.name}",${i.amount}\n`);
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Finance_Export.csv'; a.click();
        });

        // Charts
        document.getElementById('toggle-charts').addEventListener('click', () => {
            const c = document.getElementById('charts-container'); c.classList.toggle('hidden');
            if(!c.classList.contains('hidden')) renderChart();
        });

        function renderChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            
            const totalExp = dbState[currentMonth].actual.reduce((a, b) => b.isIncome ? a : a + b.amount, 0);
            const totalInc = dbState[currentMonth].actual.reduce((a, b) => b.isIncome ? a + b.amount : a, 0);
            const rem = Math.max(0, totalInc - totalExp);

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Actual Spent', 'Net Remaining'],
                    datasets: [{ data: [totalExp, rem], backgroundColor: ['#f43f5e', '#10b981'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc'} } } }
            });
        }

        // Core UI Render
        window.renderUI = function() {
            const data = dbState[currentMonth];
            if(!data) return;

            // Fuel
            document.getElementById('fuel-budget').value = data.fuel.budget;
            document.getElementById('fuel-used').value = data.fuel.used;
            updateFuel();

            // Render Projected
            let projHtml = ''; let projInc = 0; let projExp = 0;
            data.projected.forEach(item => {
                item.isIncome ? projInc += item.amount : projExp += item.amount;
                projHtml += `<div class="bg-slate-800 p-2 rounded flex items-center border-l-4 ${item.isIncome ? 'border-emerald-500' : 'border-rose-500'}">
                    <input type="text" value="${item.name}" placeholder="Item name" onchange="updateVal('projected', ${item.id}, 'name', this.value)" class="bg-transparent border-none text-sm flex-1 p-1">
                    <span class="text-xs text-slate-400 mx-1">R</span>
                    <input type="number" value="${item.amount}" onchange="updateVal('projected', ${item.id}, 'amount', this.value)" class="bg-slate-700 text-right w-20 text-sm p-1 mx-2 rounded">
                    <button onclick="deleteEntry('projected', ${item.id})" class="text-slate-500 hover:text-rose-500 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('projected-list').innerHTML = projHtml;
            document.getElementById('proj-remaining').textContent = `R ${projInc - projExp}`;

            // Render Actuals
            let actHtml = ''; let actInc = 0; let actExp = 0;
            data.actual.forEach(item => {
                item.isIncome ? actInc += item.amount : actExp += item.amount;
                actHtml += `<div class="bg-slate-800 p-2 rounded flex items-center border-l-4 ${item.isIncome ? 'border-emerald-500' : 'border-rose-500'}">
                    <input type="text" value="${item.name}" placeholder="Expense/Income" onchange="updateVal('actual', ${item.id}, 'name', this.value)" class="bg-transparent border-none text-sm flex-1 p-1">
                    <span class="text-xs text-slate-400 mx-1">R</span>
                    <input type="number" value="${item.amount}" onchange="updateVal('actual', ${item.id}, 'amount', this.value)" class="bg-slate-700 text-right w-20 text-sm p-1 mx-2 rounded">
                    <button onclick="deleteEntry('actual', ${item.id})" class="text-slate-500 hover:text-rose-500 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('actual-list').innerHTML = actHtml;
            document.getElementById('actual-income').textContent = `R ${actInc}`;
            document.getElementById('actual-total').textContent = `R ${actExp}`;

            // Render Savings
            let savHtml = ''; let savTot = 0;
            data.savings.forEach(item => {
                savTot += item.amount;
                savHtml += `<div class="bg-slate-800 p-2 rounded flex items-center border-l-4 border-sky-500">
                    <input type="text" value="${item.name}" placeholder="Fund name" onchange="updateVal('savings', ${item.id}, 'name', this.value)" class="bg-transparent border-none text-sm flex-1 p-1">
                    <span class="text-xs text-slate-400 mx-1">R</span>
                    <input type="number" value="${item.amount}" onchange="updateVal('savings', ${item.id}, 'amount', this.value)" class="bg-slate-700 text-right w-24 text-sm p-1 mx-2 rounded">
                    <button onclick="deleteEntry('savings', ${item.id})" class="text-slate-500 hover:text-rose-500 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('savings-list').innerHTML = savHtml;
            document.getElementById('savings-total').textContent = `R ${savTot}`;
            
            if(!document.getElementById('charts-container').classList.contains('hidden')) renderChart();
        }
    </script>
</body>
</html>
