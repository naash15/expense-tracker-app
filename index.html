<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slick Finance Tracker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
        .hidden { display: none; }
        input { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 0.375rem; padding: 0.5rem; width: 100%; }
        input:focus { outline: none; border-color: #38bdf8; }
        button.btn-primary { background: #0284c7; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; transition: 0.2s; }
        button.btn-primary:hover { background: #0369a1; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Login Screen -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen px-4">
        <h1 class="text-3xl font-bold mb-8 tracking-tight text-sky-400">Tracker Login</h1>
        <div class="bg-slate-800 p-6 rounded-xl w-full max-w-sm shadow-lg">
            <input type="email" id="email" placeholder="Email" class="mb-4">
            <input type="password" id="password" placeholder="Password" class="mb-6">
            <button id="login-btn" class="btn-primary w-full">Sign In</button>
            <p id="auth-error" class="text-red-400 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- Main App Dashboard -->
    <div id="app-dashboard" class="hidden flex-col min-h-screen">
        
        <!-- Header & Month Selector -->
        <header class="bg-slate-800 p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold text-sky-400">Finances</h1>
            </div>
            <div class="flex items-center gap-3">
                <select id="month-selector" class="bg-slate-700 text-sm p-2 rounded border border-slate-600 focus:outline-none text-white">
                    <option value="2026-09">September 2026</option>
                    <option value="2026-10">October 2026</option>
                </select>
                <button id="logout-btn" class="text-slate-400 hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <!-- Analytics Toggle -->
        <div class="px-4 pt-4">
            <button id="toggle-charts" class="text-sm text-sky-400 hover:text-sky-300"><i class="fa-solid fa-chart-pie mr-1"></i> Toggle Analytics</button>
            <div id="charts-container" class="hidden mt-4 bg-slate-800 p-4 rounded-xl shadow-lg">
                <canvas id="expenseChart" height="200"></canvas>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex justify-around bg-slate-900 border-b border-slate-700 mt-4 px-2">
            <button id="tab-projected" class="pb-2 px-4 tab-active font-semibold">Projected</button>
            <button id="tab-actual" class="pb-2 px-4 text-slate-400 font-semibold">Actual Tracker</button>
            <button id="tab-savings" class="pb-2 px-4 text-slate-400 font-semibold">Global Savings</button>
        </div>

        <!-- Content Area -->
        <main class="flex-1 p-4 overflow-y-auto">
            
            <!-- Projected View -->
            <div id="view-projected" class="space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <span class="text-slate-400">Projected Remaining</span>
                    <span id="proj-remaining" class="text-2xl font-bold text-emerald-400">R 0</span>
                </div>
                <div id="projected-list" class="space-y-2"></div>
                <button class="btn-primary w-full mt-4" onclick="addEntry('projected')">+ Add Expected Item</button>
            </div>

            <!-- Actual View -->
            <div id="view-actual" class="hidden space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <span class="text-slate-400">Total Spent</span>
                    <span id="actual-total" class="text-2xl font-bold text-rose-400">R 0</span>
                </div>
                <div id="actual-list" class="space-y-2"></div>
                <button class="btn-primary w-full mt-4 bg-rose-600 hover:bg-rose-700" onclick="addEntry('actual')">+ Log Expense</button>
            </div>

            <!-- Savings View -->
            <div id="view-savings" class="hidden space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <span class="text-slate-400">Total Saved</span>
                    <span id="savings-total" class="text-2xl font-bold text-sky-400">R 0</span>
                </div>
                <div id="savings-list" class="space-y-2"></div>
                <button class="btn-primary w-full mt-4 bg-sky-600 hover:bg-sky-700" onclick="addEntry('savings')">+ Add Savings Pot</button>
            </div>

        </main>
    </div>

    <!-- Firebase and Logic Scripts -->
    <script type="module">
        // 1. IMPORT FIREBASE MODULAR SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // 2. YOUR FIREBASE CONFIG
        const firebaseConfig = {
          apiKey: "AIzaSyDEJZzFtITgSstK9Kd5jV9KnUriw3EZv6M",
          authDomain: "my-expense-tracker-30b57.firebaseapp.com",
          projectId: "my-expense-tracker-30b57",
          storageBucket: "my-expense-tracker-30b57.firebasestorage.app",
          messagingSenderId: "931806220777",
          appId: "1:931806220777:web:7aad0217e0d0ae7e7bbb78"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Management
        let currentMonth = '2026-09';
        let chartInstance = null;
        
        // Initial Template (To populate your database if empty)
        let appData = {
            projected: [
                { id: 1, name: 'Takealot Salary', amount: 23045, isIncome: true },
                { id: 2, name: 'Standard Bank Bond', amount: 9880, isIncome: false },
                { id: 3, name: 'FNB Bank Charges', amount: 350, isIncome: false },
                { id: 4, name: 'UNISA', amount: 2500, isIncome: false },
                { id: 5, name: 'Honda Ballade Maint/Petrol', amount: 2000, isIncome: false }
            ],
            actual: [
                { id: 1, name: 'Woolies', amount: 120, date: '2026-09-01' },
                { id: 2, name: 'Playtomic App', amount: 150, date: '2026-09-02' }
            ],
            savings: [
                { id: 1, name: 'Tokyo Trip Fund', amount: 15000 },
                { id: 2, name: 'Joint Savings (Aneeqah & I)', amount: 5000 }
            ]
        };

        // DOM Elements
        const screens = { login: document.getElementById('login-screen'), app: document.getElementById('app-dashboard') };
        const views = { projected: document.getElementById('view-projected'), actual: document.getElementById('view-actual'), savings: document.getElementById('view-savings') };
        const tabs = { projected: document.getElementById('tab-projected'), actual: document.getElementById('tab-actual'), savings: document.getElementById('tab-savings') };

        // Authentication Logic
        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorText = document.getElementById('auth-error');
            const btn = document.getElementById('login-btn');
            
            // Clear old errors and show loading state
            errorText.classList.add('hidden');
            btn.textContent = "Authenticating...";

            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    // Success! Push directly to the tracker.
                    showApp();
                })
                .catch((err) => {
                    // Failed! Show the actual error on screen and reset the button.
                    errorText.textContent = "Error: " + err.message;
                    errorText.classList.remove('hidden');
                    btn.textContent = "Sign In";
                });
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, user => {
            if (user) { showApp(); loadData(); } 
            else { screens.login.classList.remove('hidden'); screens.app.classList.add('hidden'); }
        });

        function showApp() {
            screens.login.classList.add('hidden');
            screens.app.classList.remove('hidden');
            renderUI();
        }

        // Tab Switching Logic
        Object.keys(tabs).forEach(key => {
            tabs[key].addEventListener('click', () => {
                Object.values(views).forEach(v => v.classList.add('hidden'));
                Object.values(tabs).forEach(t => { t.classList.remove('tab-active'); t.classList.add('text-slate-400'); });
                
                views[key].classList.remove('hidden');
                tabs[key].classList.add('tab-active');
                tabs[key].classList.remove('text-slate-400');
            });
        });

        // Toggle Charts
        document.getElementById('toggle-charts').addEventListener('click', () => {
            const container = document.getElementById('charts-container');
            container.classList.toggle('hidden');
            if(!container.classList.contains('hidden')) renderChart();
        });

        // Core Render Function
        window.renderUI = function() {
            // Render Projected
            let projHtml = '';
            let totalIncome = 0;
            let totalProjExp = 0;
            appData.projected.forEach(item => {
                if(item.isIncome) totalIncome += item.amount;
                else totalProjExp += item.amount;
                
                projHtml += `
                <div class="bg-slate-800 p-3 rounded flex justify-between items-center border-l-4 ${item.isIncome ? 'border-emerald-500' : 'border-rose-500'}">
                    <input type="text" value="${item.name}" class="bg-transparent border-none text-sm w-1/2 p-0">
                    <div class="flex items-center gap-2">
                        <span class="text-sm">R</span>
                        <input type="number" value="${item.amount}" class="bg-slate-700 text-right w-20 text-sm p-1 rounded">
                    </div>
                </div>`;
            });
            document.getElementById('projected-list').innerHTML = projHtml;
            document.getElementById('proj-remaining').textContent = `R ${totalIncome - totalProjExp}`;

            // Render Actuals
            let actHtml = '';
            let totalActExp = 0;
            appData.actual.forEach(item => {
                totalActExp += item.amount;
                actHtml += `
                <div class="bg-slate-800 p-3 rounded flex justify-between items-center border-l-4 border-rose-500">
                    <input type="text" value="${item.name}" class="bg-transparent border-none text-sm w-1/2 p-0">
                    <div class="flex items-center gap-2">
                        <span class="text-sm">R</span>
                        <input type="number" value="${item.amount}" class="bg-slate-700 text-right w-20 text-sm p-1 rounded">
                    </div>
                </div>`;
            });
            document.getElementById('actual-list').innerHTML = actHtml;
            document.getElementById('actual-total').textContent = `R ${totalActExp}`;

            // Render Savings
            let savHtml = '';
            let totalSav = 0;
            appData.savings.forEach(item => {
                totalSav += item.amount;
                savHtml += `
                <div class="bg-slate-800 p-3 rounded flex justify-between items-center border-l-4 border-sky-500">
                    <input type="text" value="${item.name}" class="bg-transparent border-none text-sm w-1/2 p-0">
                    <div class="flex items-center gap-2">
                        <span class="text-sm">R</span>
                        <input type="number" value="${item.amount}" class="bg-slate-700 text-right w-24 text-sm p-1 rounded">
                    </div>
                </div>`;
            });
            document.getElementById('savings-list').innerHTML = savHtml;
            document.getElementById('savings-total').textContent = `R ${totalSav}`;
            
            if(!document.getElementById('charts-container').classList.contains('hidden')) renderChart();
        }

        window.addEntry = function(type) {
            if(type === 'projected') appData.projected.push({ id: Date.now(), name: 'New Item', amount: 0, isIncome: false });
            if(type === 'actual') appData.actual.push({ id: Date.now(), name: 'New Expense', amount: 0, date: new Date().toISOString().split('T')[0] });
            if(type === 'savings') appData.savings.push({ id: Date.now(), name: 'New Fund', amount: 0 });
            renderUI();
        }

        function renderChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Actual Spent', 'Remaining Budget'],
                    datasets: [{
                        data: [
                            appData.actual.reduce((a,b) => a + b.amount, 0), 
                            Math.max(0, appData.projected.reduce((a,b) => b.isIncome ? a + b.amount : a - b.amount, 0) - appData.actual.reduce((a,b) => a + b.amount, 0))
                        ],
                        backgroundColor: ['#f43f5e', '#10b981'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc'} } } }
            });
        }
        
        // Mock data load call
        async function loadData() {
            // Here is where Firestore getting logic will go!
            renderUI();
        }
    </script>
</body>
</html>
